plugins {
    id 'dev.architectury.loom'
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName('NeoForge Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }

        server {
            server()
            setConfigName('NeoForge Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom(common)
    runtimeClasspath.extendsFrom(common)

    developmentNeoForge.extendsFrom(common)
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    modImplementation "dev.architectury:architectury-neoforge:${architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) {
        transitive = false
    }

    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) {
        transitive = false
    }
}

processResources {
    inputs.properties([
            version: project.version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_author: mod_author,
            description: description,
            license: license,
            credits: credits,
            minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version,
            neoforge_loader_version_range: neoforge_loader_version_range
    ])

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(project.properties)
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
}

jar {
    archiveClassifier = 'dev'
}